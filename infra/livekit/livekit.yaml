# =============================================================================
# LiveKit Server — Local Development Configuration
# =============================================================================
# This config is mounted read-only into the LiveKit container.
# Do NOT use these settings in production.
# =============================================================================

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7882
  use_external_ip: false
  node_ip: 127.0.0.1

keys:
  devkey: secret

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300       # 5 minutes
  max_participants: 20

webhook:
  urls:
    - http://host.docker.internal:8080/api/webhook/livekit
  api_key: devkey

turn:
  enabled: false
